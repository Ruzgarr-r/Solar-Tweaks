name: 'Build All Platforms'

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact_pattern: dist/*.AppImage
          - os: macos-latest
            flag: --mac
            artifact_pattern: dist/*.dmg
          - os: windows-latest
            flag: --win
            artifact_pattern: dist/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - run: npm install

      - run: npm run build -- ${{ matrix.flag }} -p never

      - uses: actions/upload-artifact@v4
        with:
          name: Solar-Tweaks-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
